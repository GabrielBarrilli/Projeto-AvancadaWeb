spring:

  application:
    name: ProjetoAvancadaWeb

  main:
    allow-circular-references: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

token:
  jwt:
    issuer: projetoavancadaweb-exemple-issuer
    secret-key: ${JWT_SECRET}



